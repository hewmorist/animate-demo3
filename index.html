  if(!ascentResults.size){
    metric.textContent=label+'awaiting a matched frame.\n'+
      (descentSamples.length?'Reference: '+descentSamples.length+' descent samples collected.':'Play the descent first to collect reference frames.')+
      ' RGB difference: 0% means identical.';
    updateErrorTicks();
    return;
  }
  let all=0,edge=0,gapTotal=0;
  const bins=Array.from({length:intervalCount},()=>({all:0,edge:0,count:0}));
  for(const result of ascentResults.values()){
    all+=result.all;edge+=result.edge;gapTotal+=result.gap;
    const bin=clamp(Math.floor((result.ascentNominal-nominalDuration/2)/intervalSpan),0,intervalCount-1);
    bins[bin].all+=result.all;bins[bin].edge+=result.edge;bins[bin].count++;
  }
  const count=ascentResults.size;
  const local=bins[selected],covered=bins.filter(bin=>bin.count).length;
  metric.textContent=label+(local.count
    ?'whole '+(local.all/local.count).toFixed(1)+'%, edge '+(local.edge/local.count).toFixed(1)+'% ('+local.count+' pairs).'
    :'no matched frames yet.')+
    '\n'+(ended?'Overall sampled run':'Overall so far')+': whole '+(all/count).toFixed(1)+'%, edge '+(edge/count).toFixed(1)+
    '% · '+covered+'/'+intervalCount+' intervals, '+count+' pairs; mean depth gap '+(gapTotal/count).toFixed(2)+' s. Lower is better.';
  updateErrorTicks();
}
function sampleComparison(t){
  if(!playing||scrubbing)return;
  const nominal=t*nominalDuration/recipe.duration,goingIn=nominal<nominalDuration/2;
  const depthTime=goingIn?nominal:nominalDuration-nominal;
  if(goingIn){
    if(Math.abs(depthTime-lastCapturedNominal)>=.10){
      lastCapturedNominal=depthTime;
      if(!descentSamples.some(sample=>Math.abs(sample.time-depthTime)<.04)){
        descentSamples.push({time:depthTime,pixels:captureDisplay()});updateMetric();
      }
    }
  }else{
    const bucket=Math.round(depthTime*2);
    if(!descentSamples.length)return;
    let best=null,gap=Infinity;
    for(const sample of descentSamples){
      const distance=Math.abs(sample.time-depthTime);
      if(distance<gap){best=sample;gap=distance}
    }
    if(gap>.20||(ascentResults.has(bucket)&&gap>=ascentResults.get(bucket).gap))return;
    ascentResults.set(bucket,{...comparePixels(best.pixels,captureDisplay()),gap,ascentNominal:nominalDuration-depthTime});
    updateMetric();
  }
}
timeline.addEventListener('input',()=>{
  scrubbing=true;
  updateTimeline(Number(timeline.value));
});
timeline.addEventListener('change',()=>{
  const target=clamp(Number(timeline.value),0,recipe.duration);
  if(playing||starting){starting=false;resumeRequested=false;stopProbe();setPlaying(false);widget?.pause()}
  position=target;anchor=target;anchorTime=performance.now();ended=false;
  scrubbing=false;lastCapturedNominal=-Infinity;clearEdge();
  widget?.seekTo(target*1000);draw(position);updateTimeline(position);updateMetric(position);
});
function clock(){return clamp(anchor+(performance.now()-anchorTime)/1000,0,recipe.duration)}
function setPlaying(value){playing=value;playButton.textContent=value?'❚❚ Pause':'▶ Play';playButton.disabled=false}
function stopProbe(){if(probeTimer)clearInterval(probeTimer);probeTimer=null;lastProbe=null}
function activate(ms){
  if(!starting)return;
  starting=false;stopProbe();
  if(Number.isFinite(ms)&&ms>=0)position=clamp(ms/1000,0,recipe.duration);
  anchor=position;anchorTime=performance.now();status.textContent='';setPlaying(true);draw(position);
}
function observe(ms){
  if((!starting&&!(resumeRequested&&!playing))||!Number.isFinite(ms)||ms<0)return;
  // A paused track can already be far from zero; only new movement proves playback resumed.
  if(lastProbe!==null&&ms-lastProbe>=60){
    if(!starting)starting=true;
    activate(ms);return;
  }
  if(lastProbe===null||ms<lastProbe)lastProbe=ms;
}
function requestStart(){
  if(!widgetReady||starting)return;
  if(ended){widget.seekTo(0);position=0;ended=false;clearEdge();descentSamples.length=0;lastCapturedNominal=-Infinity;ascentResults.clear();updateMetric()}
  starting=true;resumeRequested=true;status.textContent='';probeStarted=performance.now();
  playButton.textContent='Starting…';
  let retries=0;
  probeTimer=setInterval(()=>{
    if(!starting||!widgetReady){stopProbe();return}
    widget.getPosition(observe);
    if(/iPhone|iPod/.test(navigator.userAgent)&&performance.now()-probeStarted>900*(retries+1)&&retries<3){retries++;widget.play()}
    if(performance.now()-probeStarted>5000){starting=false;resumeRequested=false;stopProbe();setPlaying(false);status.textContent='SoundCloud did not start. Tap Play again.'}
  },180);
  widget.play();
}
playButton.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'&&/iPhone|iPod/.test(navigator.userAgent)&&widgetReady&&!playing&&!starting){
    gestureStarted=true;requestStart();
  }else gestureStarted=false;
});
playButton.addEventListener('click',()=>{
  if(gestureStarted){gestureStarted=false;if(widgetReady&&!playing)widget.play();return}
  if(!widgetReady)return;
  if(playing){resumeRequested=false;position=clock();setPlaying(false);draw(position);widget.pause();return}
  requestStart();
});
if(new URLSearchParams(location.search).has('testAudio'))testPanel.hidden=false;
loadTrack.addEventListener('click',()=>{
  const raw=embedCode.value.trim();
  const src=raw.match(/<iframe\b[^>]*\bsrc=["']([^"']+)["']/i)?.[1]?.replaceAll('&amp;','&');
  let target;
  try{
    const player=new URL(src);
    if(player.protocol!=='https:'||player.hostname!=='w.soundcloud.com'||player.pathname!=='/player/')throw Error('player');
    target=new URL(player.searchParams.get('url'));
    if(target.protocol!=='https:'||target.hostname!=='api.soundcloud.com'||!/^\/tracks\//.test(target.pathname))throw Error('track');
  }catch(_){status.textContent='Paste the full iframe code from SoundCloud Share → Embed.';return}
  if(!widget){status.textContent='SoundCloud player is still loading.';return}
  starting=false;resumeRequested=false;stopProbe();playing=false;widgetReady=false;ended=false;position=0;anchor=0;clearEdge();
  playButton.disabled=true;playButton.textContent='Loading track…';status.textContent='';
  embedCode.value='';
  widget.load(target.href,{auto_play:false,visual:false,show_comments:false,show_reposts:false,callback:audioReady});
});
function audioReady(){
  widgetReady=true;resumeRequested=false;setPlaying(false);status.textContent='';
  widget.getDuration(ms=>{if(Number.isFinite(ms)&&ms>0){recipe.duration=ms/1000;recipe.segments.forEach((s,i)=>s.time=baseTimes[i]*recipe.duration/nominalDuration);buildMarkers();draw(position);updateMetric(position)}});
}
function initAudio(){
  if(!window.SC?.Widget){playButton.textContent='Track unavailable';status.textContent='SoundCloud could not load.';return}
  sc.src='https://w.soundcloud.com/player/?url='+encodeURIComponent(recipe.soundcloud)+'&auto_play=false&visual=false&show_comments=false&show_reposts=false';
  widget=SC.Widget(sc);
  widget.bind(SC.Widget.Events.READY,audioReady);
  widget.bind(SC.Widget.Events.PLAY_PROGRESS,e=>observe(e?.currentPosition));
  widget.bind(SC.Widget.Events.PAUSE,()=>{
    if(starting&&!playing)return;
    if(playing){position=clock();setPlaying(false);draw(position);lastProbe=null}
  });
  widget.bind(SC.Widget.Events.FINISH,()=>{starting=false;resumeRequested=false;stopProbe();position=recipe.duration;ended=true;setPlaying(false);draw(position);updateMetric(position)});
  widget.bind(SC.Widget.Events.ERROR,()=>{starting=false;resumeRequested=false;stopProbe();widgetReady=false;playButton.textContent='Track unavailable';playButton.disabled=true;status.textContent='SoundCloud could not play this track.'});
}
function frame(now){
  if(!playing&&previous)
    draw(position);
  if(playing){
    if(widgetReady&&now-lastPoll>200){
      lastPoll=now;widget.getPosition(ms=>{
        if(!playing||!Number.isFinite(ms))return;
        const actual=ms/1000;if(Math.abs(actual-clock())>.15){anchor=actual;anchorTime=performance.now()}
      });
    }
    position=clock();draw(position);sampleComparison(position);
  }
  requestAnimationFrame(frame);
}
buildMarkers();
if(Number.isFinite(previewTime)&&previewTime>0){position=clamp(previewTime,0,recipe.duration);draw(position)}
else draw(0);
initAudio();requestAnimationFrame(frame);
</script>
</body>
</html>
