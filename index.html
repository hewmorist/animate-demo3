    if(player.protocol!=='https:'||player.hostname!=='w.soundcloud.com'||player.pathname!=='/player/')throw Error('player');
    target=new URL(player.searchParams.get('url'));
    if(target.protocol!=='https:'||target.hostname!=='api.soundcloud.com'||!/^\/tracks\//.test(target.pathname))throw Error('track');
  }catch(_){status.textContent='Paste the full iframe code from SoundCloud Share → Embed.';return}
  if(!widget){status.textContent='SoundCloud player is still loading.';return}
  starting=false;resumeRequested=false;stopProbe();playing=false;widgetReady=false;ended=false;position=0;anchor=0;
  playButton.disabled=true;playButton.textContent='Loading track…';status.textContent='';
  embedCode.value='';
  widget.load(target.href,{auto_play:false,visual:false,show_comments:false,show_reposts:false,callback:audioReady});
});
function audioReady(){
  widgetReady=true;resumeRequested=false;setPlaying(false);status.textContent='';
  widget.getDuration(ms=>{if(Number.isFinite(ms)&&ms>0){recipe.duration=ms/1000;recipe.segments.forEach((s,i)=>s.time=baseTimes[i]*recipe.duration/nominalDuration);draw(position)}});
}
function initAudio(){
  if(!window.SC?.Widget){playButton.textContent='Track unavailable';status.textContent='SoundCloud could not load.';return}
  sc.src='https://w.soundcloud.com/player/?url='+encodeURIComponent(recipe.soundcloud)+'&auto_play=false&visual=false&show_comments=false&show_reposts=false';
  widget=SC.Widget(sc);
  widget.bind(SC.Widget.Events.READY,audioReady);
  widget.bind(SC.Widget.Events.PLAY_PROGRESS,e=>observe(e?.currentPosition));
  widget.bind(SC.Widget.Events.PAUSE,()=>{
    if(starting&&!playing)return;
    if(playing){position=clock();setPlaying(false);draw(position);lastProbe=null}
  });
  widget.bind(SC.Widget.Events.FINISH,()=>{starting=false;resumeRequested=false;stopProbe();position=recipe.duration;ended=true;setPlaying(false);draw(position)});
  widget.bind(SC.Widget.Events.ERROR,()=>{starting=false;resumeRequested=false;stopProbe();widgetReady=false;playButton.textContent='Track unavailable';playButton.disabled=true;status.textContent='SoundCloud could not play this track.'});
}
function frame(now){
  if(playing){
    if(widgetReady&&now-lastPoll>200){
      lastPoll=now;widget.getPosition(ms=>{
        if(!playing||!Number.isFinite(ms))return;
        const actual=ms/1000;if(Math.abs(actual-clock())>.15){anchor=actual;anchorTime=performance.now()}
      });
    }
    position=clock();draw(position);
  }
  requestAnimationFrame(frame);
}
for(const spec of recipe.keyframes||[]){
  const img=new Image();img.decoding='async';
  img.onload=()=>{
    preparedFrames.push({canvas:img,p:{cx:spec.cx,cy:spec.cy,span:spec.span},prepared:true});
    if(!playing)draw(position);
  };
  img.src=spec.src;
}
if(Number.isFinite(previewTime)&&previewTime>0){position=clamp(previewTime,0,recipe.duration);draw(position)}
else draw(0);
initAudio();requestAnimationFrame(frame);
</script>
