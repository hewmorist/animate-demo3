<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fractal Descent</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#080a13;color:#f3f3fa;min-height:100dvh;display:grid;place-items:center}.app{width:min(100vw,720px);padding:12px}.head,.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}.head b{letter-spacing:.12em;color:#86e8ff}.stats{font-size:12px;color:#b5c9d9;text-align:right}.stage{position:relative;width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#050711;box-shadow:0 14px 55px #0009;touch-action:none}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:0;pointer-events:none}.ship{position:absolute;left:50%;top:51%;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:24px solid white;filter:drop-shadow(0 0 9px #80eaff);transform:translate(-50%,-50%) rotate(180deg)}.reticle{position:absolute;left:50%;top:50%;width:30px;height:30px;border:1px solid #a8efff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 10px #6ce6ff}.reticle:after{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff}.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#080a13d9;padding:28px}.overlay.hide{display:none}.panel{max-width:420px}.panel h1{font-size:clamp(30px,7vw,48px);color:#a5f3ff;margin:0}.panel p{line-height:1.55;color:#e0e4ed}button{border:1px solid #83d9ef;background:#183249;color:#fff;border-radius:9px;padding:10px 16px;font:inherit;cursor:pointer}.panel button{font-size:19px;padding:13px 30px}.foot{font-size:13px;color:#aabbc8}.foot button{padding:7px 11px}.bar{height:4px;background:#13253a;border-radius:4px;overflow:hidden}.bar span{display:block;height:100%;background:#76e4ff;width:0%}
</style><div class="app"><div class="head"><b>FRACTAL DESCENT</b><div class="stats"><span id="depth">DEPTH 0</span> · <span id="region">REGION 1</span></div></div><div class="stage" id="stage"><canvas id="view" width="800" height="800"></canvas><div class="hud"><div class="reticle" id="reticle"></div></div><div class="overlay" id="overlay"><div class="panel"><h1 id="heading">FRACTAL DESCENT</h1><p id="copy">Drag to steer the view toward interesting detail. The target ring shows where the next moment of the descent is headed. Each deep dive leads to a new region so the journey can continue.</p><button id="action">START DESCENT</button></div></div></div><div class="bar"><span id="progress"></span></div><div class="foot"><span>Drag / arrow keys to steer · Space to pause</span><button id="pause">PAUSE</button></div></div>
<script>document.getElementById("action").textContent="SCRIPT ACTIVE";</script><script src="game.js?v=5"></script></html>
