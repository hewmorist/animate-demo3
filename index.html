<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life — a musical experiment</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0c1118;color:#eff4f0}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:22px}h1{font-size:clamp(2rem,6vw,3.5rem);margin:0}p{color:#b4c5c5;line-height:1.5}.layout{display:grid;grid-template-columns:1fr 280px;gap:22px;align-items:start}canvas{width:100%;aspect-ratio:1;background:#07121a;border:1px solid #355059;border-radius:12px}.panel{background:#17232b;border:1px solid #355059;border-radius:12px;padding:18px}label{display:block;margin:12px 0}input[type=range]{width:100%;accent-color:#7de5ba}button{font:inherit;background:#83ebbb;color:#10241b;border:0;border-radius:9px;padding:12px 22px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.secondary{background:#364c55;color:white}select{font:inherit;background:#243842;color:white;border:1px solid #66848b;border-radius:6px;padding:5px}output{float:right;color:#9feac4}.stats{display:flex;justify-content:space-between;margin:12px 0;font-variant-numeric:tabular-nums}#status{min-height:3em;color:#d1decf}.soundcloud{position:absolute;left:-10000px;width:300px;height:166px;overflow:hidden}@media(max-width:720px){.layout{grid-template-columns:1fr}.panel{order:-1}}
</style></head><body><main><h1>Life</h1><p>Give a hundred cells a world to grow in. The outcome is calculated first; the music follows their fate. The ending stays hidden until the track finishes.</p><div class="layout"><div><canvas id="field" width="576" height="576" aria-label="Cell population"></canvas><div class="stats"><span id="clock">0:00</span><span id="population">100 cells</span></div><p id="status" role="status">Choose your conditions.</p></div><div class="panel"><label>Founders <select id="founders"><option value="1">One cell</option><option value="2">Two cells</option><option value="100" selected>100 cells</option></select></label><label>Fertility <output id="fertility-value"></output><input id="fertility" type="range" min="5" max="90" value="48"></label><label>Resources <output id="resources-value"></output><input id="resources" type="range" min="5" max="90" value="45"></label><label>Resilience <output id="resilience-value"></output><input id="resilience" type="range" min="5" max="90" value="42"></label><label>World seed <input id="seed" type="number" min="1" max="999999" value="219" style="width:110px;font:inherit"></label><p>Same settings and seed give the same life story.</p><button id="start" disabled>Calculating…</button> <button id="reset" class="secondary" type="button">New world</button><p id="track" aria-live="polite"></p></div></div><div class="soundcloud"><iframe id="sc" title="SoundCloud audio player" allow="autoplay" src="about:blank"></iframe></div></main><script src="https://w.soundcloud.com/player/api.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),N=48,SIZE=N*N,RATE=4,PLAN_SECONDS=259;
const tracks={extinct:{title:'Piano and Strings',url:'https://soundcloud.com/hewmorist/piano-and-strings'},surviving:{title:'Fractal Journey',url:'https://soundcloud.com/hewmorist/fractal-journey'},thriving:{title:'Planet Mandelbrot',url:'https://soundcloud.com/hewmorist/mandelbrot-techno'}};
const canvas=$('field'),ctx=canvas.getContext('2d');let frames=[],counts=[],outcome='',widget=null,ready=false,playing=false,starting=false,elapsed=0,duration=PLAN_SECONDS,anchor=0,anchorTime=0,token=0,probe=null,prepared=false;
const work=new Worker(URL.createObjectURL(new Blob([`const N=${N},SIZE=N*N,RATE=${RATE};
function rand(seed,step,i,salt){let x=(seed^Math.imul(step+1,0x9e3779b1)^Math.imul(i+1,0x85ebca6b)^salt)|0;x=Math.imul(x^(x>>>16),0x7feb352d);x=Math.imul(x^(x>>>15),0x846ca68b);return ((x^(x>>>16))>>>0)/4294967296}
onmessage=e=>{let {settings,token,seconds}=e.data,seed=settings.seed|0,live=new Uint8Array(SIZE),frames=[],counts=[];let middle=(N>>1)*N+(N>>1);if(settings.founders===100){let places=new Uint16Array(SIZE);for(let i=0;i<SIZE;i++)places[i]=i;for(let i=0;i<100;i++){let j=i+Math.floor(rand(seed,0,i,19)*(SIZE-i)),v=places[i];places[i]=places[j];places[j]=v;live[places[i]]=1}}else{live[middle]=1;if(settings.founders===2)live[middle+1]=1;}let cap=Math.round(20+settings.resources/100*SIZE*.65);for(let step=0;step<=Math.ceil(seconds*RATE);step++){frames.push(live);let pop=0;for(let v of live)pop+=v;counts.push(pop);if(step===Math.ceil(seconds*RATE))break;let next=new Uint8Array(SIZE),pressure=pop/cap;for(let i=0;i<SIZE;i++){let x=i%N,y=(i/N)|0,neighbors=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;neighbors+=live[((y+dy+N)%N)*N+(x+dx+N)%N]}
if(live[i]){let death=.008+(1-settings.resilience/100)*.065+Math.max(0,pressure-.55)*.15+Math.max(0,neighbors-4)*.08;next[i]=rand(seed,step,i,1)>=death?1:0}else if(neighbors){let birth=(settings.fertility/100)*.058*neighbors*Math.max(.008,1-pressure)*Math.max(.12,1-neighbors/10);next[i]=rand(seed,step,i,2)<birth?1:0}}
live=next}let last=counts.at(-1),peak=Math.max(...counts),outcome=last===0?'extinct':last>=Math.max(45,cap*.22)?'thriving':'surviving';postMessage({token,frames,counts,outcome,peak,cap},frames.map(f=>f.buffer))};`],{type:'text/javascript'})));
function settings(){return {founders:+$('founders').value,fertility:+$('fertility').value,resources:+$('resources').value,resilience:+$('resilience').value,seed:Math.max(1,Math.min(999999,+$('seed').value||1))}}
function time(t){return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
function show(t){let index=Math.min(frames.length-1,Math.floor(t/Math.max(1,duration)*PLAN_SECONDS*RATE));let cells=frames[index];if(!cells)return;ctx.fillStyle='#07121a';ctx.fillRect(0,0,576,576);ctx.fillStyle='#81eec2';for(let i=0;i<SIZE;i++)if(cells[i])ctx.fillRect((i%N)*12+1,Math.floor(i/N)*12+1,10,10);$('population').textContent=counts[index]+' cells';$('clock').textContent=time(t)}
function status(message){$('status').textContent=message}
function controls(){let s=settings();for(let key of ['fertility','resources','resilience'])$(key+'-value').textContent=s[key]+'%'}
function stop(){clearInterval(probe);probe=null;if(widget)widget.pause();playing=false;starting=false;elapsed=0}
function prepare(){let id=++token;stop();ready=false;prepared=false;frames=[];counts=[];$('start').disabled=true;$('start').textContent='Calculating…';$('track').textContent='';controls();status('Calculating the life story…');work.postMessage({token:id,settings:settings(),seconds:PLAN_SECONDS})}
work.onmessage=e=>{let d=e.data;if(d.token!==token)return;frames=d.frames.map(b=>new Uint8Array(b));counts=d.counts;outcome=d.outcome;prepared=true;show(0);status('Life story calculated. Loading its music…');$('track').textContent='Music selected for this world. Its ending is still a surprise.';loadTrack(tracks[outcome].url,d.token)};
work.onerror=()=>{status('The simulation could not run. Reload the page to try again.');$('start').textContent='Unavailable'};
function loadTrack(url,id){if(!window.SC?.Widget){status('SoundCloud player is unavailable.');return}if(widget){widget.load(url,{auto_play:false,visual:false,show_comments:false,show_reposts:false,callback:()=>audioReady(id)})}else{$('sc').src='https://w.soundcloud.com/player/?url='+encodeURIComponent(url)+'&auto_play=false&visual=false&show_comments=false&show_reposts=false';widget=SC.Widget($('sc'));widget.bind(SC.Widget.Events.READY,()=>audioReady(id));widget.bind(SC.Widget.Events.PLAY_PROGRESS,e=>{if(!starting||!Number.isFinite(e?.currentPosition)||e.currentPosition<250)return;starting=false;playing=true;elapsed=e.currentPosition/1000;anchor=elapsed;anchorTime=performance.now();$('start').textContent='Pause';status('The world is unfolding.');clearInterval(probe);probe=null});widget.bind(SC.Widget.Events.PAUSE,()=>{if(playing){elapsed=clock();playing=false;$('start').textContent='Resume';status('Paused.')}});widget.bind(SC.Widget.Events.FINISH,finish);widget.bind(SC.Widget.Events.ERROR,()=>{ready=false;$('start').disabled=true;status('The selected SoundCloud track could not load. Change a setting to try again.')})}}
function audioReady(id){if(id!==token||!prepared)return;ready=true;$('start').disabled=false;$('start').textContent='Start';status('Ready. Tap Start to hear this world’s music.');widget.getDuration(ms=>{if(id===token&&Number.isFinite(ms)&&ms>0)duration=ms/1000})}
function clock(){return Math.min(duration,anchor+(performance.now()-anchorTime)/1000)}
function tick(){if(playing){elapsed=clock();show(elapsed);if(elapsed>=duration)finish()}requestAnimationFrame(tick)}
function finish(){if(!prepared||!playing&&!starting)return;clearInterval(probe);probe=null;playing=false;starting=false;elapsed=duration;show(duration);$('start').textContent='Replay';status(outcome==='extinct'?'Extinct: the population died out.':outcome==='thriving'?'Thriving: the population filled its world.':'Surviving: the population made it through.');$('track').textContent='Soundtrack: '+tracks[outcome].title}
$('start').onclick=()=>{if(!ready)return;if(playing){elapsed=clock();playing=false;widget.pause();$('start').textContent='Resume';return}if(elapsed>=duration){elapsed=0;show(0);widget.seekTo(0)}starting=true;status('Starting SoundCloud…');$('start').textContent='Starting…';widget.play();let tries=0;clearInterval(probe);probe=setInterval(()=>{if(!starting)return;if(++tries===3&&/iPhone|iPod/.test(navigator.userAgent))widget.play();if(tries>12){clearInterval(probe);probe=null;starting=false;$('start').textContent='Start';status('SoundCloud did not start. Tap Start again.')}},400)};
$('reset').onclick=()=>{$('seed').value=1+Math.floor(Math.random()*999999);prepare()};for(let key of ['founders','fertility','resources','resilience','seed'])$(key).addEventListener('change',prepare);prepare();requestAnimationFrame(tick);
</script></body></html>
